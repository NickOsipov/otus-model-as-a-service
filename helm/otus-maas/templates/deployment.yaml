apiVersion: apps/v1
kind: Deployment
metadata:
  name: otus-maas
  namespace: otus-maas
  labels:
    app: otus-maas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otus-maas
  template:
    metadata:
      labels:
        app: otus-maas
    spec:
      containers:
        - name: otus-maas
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
