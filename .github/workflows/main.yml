name: CI/CD Pipeline

on:
  push:
    branches: [ k8s ]
  pull_request:
    branches: [ k8s ]

env:
  DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
  DOCKER_HUB_REPOSITORY: ${{ secrets.DOCKER_HUB_REPOSITORY }}
  DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
  IMAGE_NAME: ${{ secrets.DOCKER_HUB_USER }}/${{ secrets.DOCKER_HUB_REPOSITORY }}:latest
  CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SERVER_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  PYTHON_VERSION: '3.11'
  RELEASE_NAME: 'otus-maas'
  NAMESPACE: 'otus-maas'
  CHART_NAME: 'helm/otus-maas'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Checkout repository
      run: ls -la
    - name: Build Docker image
      run: docker build -f Dockerfile.prod -t ${{ env.IMAGE_NAME }} .
    - name: Login to Docker Hub
      uses: docker/login-action@v1
      with:
        username: ${{ env.DOCKER_HUB_USER }}
        password: ${{ env.DOCKER_HUB_ACCESS_TOKEN }}
    - name: Push image to Docker Hub
      run: docker push ${{ env.IMAGE_NAME }}

  deploy:
    needs: build
    runs-on: 'ubuntu-latest'
    steps:
    - uses: actions/checkout@v1

    - name: 'Deploy'
      uses: 'deler-aziz/helm-deploy-action@v1.0.0'
      with:
        release: '${{ env.RELEASE_NAME }}'
        namespace: '${{ env.NAMESPACE }}'
        namespace-create: 'true'
        chart: '${{ env.CHART_NAME }}'
        token: '${{ github.token }}'
      env:
        KUBECONFIG_FILE: '${{ secrets.KUBECONFIG }}'
